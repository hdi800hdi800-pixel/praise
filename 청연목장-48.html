<style>
  :root{
    --paper:#EEF1EA;
    --card:#FBFAF5;
    --ink:#2A3428;
    --sage:#6B7F5E;
    --sage-deep:#465C43;
    --sage-soft:#DDE5D5;
    --gold:#C6A24B;
    --gold-soft:#F2E9CE;
    --muted:#8A9184;
    --line:#DFE2D8;
    --danger:#B4655A;
    --shadow:0 2px 10px rgba(50,60,45,.06),0 8px 30px rgba(50,60,45,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Pretendard',-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  /* ── Header ── */
  header{text-align:center;padding:30px 16px 22px}
  .logo{width:86px;height:86px;margin:0 auto 16px;background:#2BB9CD;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Jua',sans-serif;color:#fff;line-height:.98;box-shadow:0 6px 18px rgba(43,185,205,.35)}
  .logo span{font-size:30px;letter-spacing:.02em}
  .kicker{font-size:12px;letter-spacing:.28em;color:var(--sage);font-weight:700;text-transform:uppercase;margin-bottom:8px}
  .mokjang-name{
    font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:30px;line-height:1.2;
    color:var(--sage-deep);border:none;background:transparent;text-align:center;
    width:100%;padding:2px 6px;border-radius:8px;
  }
  .mokjang-name:focus{outline:2px solid var(--sage-soft);background:#fff}
  .verse{font-family:'Nanum Myeongjo',serif;font-size:15px;color:var(--muted);margin-top:12px;line-height:1.7}
  .verse b{color:var(--sage);font-weight:700}

  /* ── Card ── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:10px}
  .card-title{font-size:17px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
  .card-title .dot{width:9px;height:9px;border-radius:50%;background:var(--sage);display:inline-block;flex-shrink:0}
  .card-sub{font-size:13px;color:var(--muted);font-weight:600}

  /* ── Week nav ── */
  .weeknav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px}
  .weeknav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;color:var(--sage-deep);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .weeknav button:active{background:var(--sage-soft)}
  .weeklabel{font-weight:700;font-size:15px;min-width:150px;text-align:center}

  /* ── Attendance (photo grid) ── */
  .members{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:16px 6px;margin-top:16px}
  .mcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;user-select:none}
  .avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2.5px solid var(--line);background:var(--sage-soft);color:var(--sage-deep);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;transition:border-color .15s,box-shadow .15s,transform .12s}
  .mcard:active .avatar{transform:scale(.94)}
  .mcard.present .avatar{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-soft)}
  .mcard .mname{font-size:13px;font-weight:600;color:var(--ink);text-align:center;line-height:1.2;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mcard.present .mname{color:var(--sage-deep);font-weight:700}
  .badge{position:absolute;top:-3px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--sage);color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;border:2px solid var(--card)}
  .mcard.present .badge{display:flex}
  .rmx{position:absolute;top:-3px;left:6px;width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--danger);font-size:11px;line-height:1;cursor:pointer;opacity:.5;display:flex;align-items:center;justify-content:center;padding:0}
  .count-line{margin-top:18px;text-align:center;font-size:14px;color:var(--muted)}
  .count-line b{color:var(--sage-deep);font-size:22px;font-weight:800;font-family:'Nanum Myeongjo',serif}

  /* ── Inputs ── */
  .addrow{display:flex;gap:8px;margin-top:14px}
  input[type=text],textarea,.inp{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff}
  input[type=text]:focus,textarea:focus{outline:2px solid var(--sage-soft);border-color:var(--sage)}
  textarea{resize:vertical;min-height:46px;width:100%}
  .btn{border:none;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--sage);color:#fff;flex-shrink:0}
  .btn:active{background:var(--sage-deep)}
  .btn.ghost{background:var(--sage-soft);color:var(--sage-deep)}
  .pick-label{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 8px}
  .pickrow{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
  .pick{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;user-select:none;width:56px}
  .pick .pav{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2.5px solid var(--line);background:var(--sage-soft);color:var(--sage-deep);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;transition:border-color .15s,box-shadow .15s,transform .12s}
  .pick .pnm{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.1;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick.sel .pav{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-soft)}
  .pick.sel .pnm{color:var(--sage-deep);font-weight:700}
  .pick:active .pav{transform:scale(.94)}

  /* ── Passage banner (오늘 본문) ── */
  .passage{
    font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:16px;
    color:var(--sage-deep);background:var(--sage-soft);
    border:none;border-radius:12px;padding:12px 14px;text-align:center;width:100%;
    margin-bottom:4px;
  }
  .passage::placeholder{color:var(--sage);opacity:.7;font-weight:400}
  .passage:focus{outline:2px solid var(--sage)}

  /* ── Shared list items (나눔) ── */
  .item{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:11px;background:#fff}
  .item .i-author{font-weight:700;font-size:14px;color:var(--sage-deep);margin-bottom:5px}
  .item .i-text{font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .item .i-actions{display:flex;gap:8px;margin-top:10px}

  /* ── Prayers ── */
  .prayer{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:11px;background:#fff;position:relative}
  .prayer.answered{background:var(--gold-soft);border-color:#E7D9AE}
  .prayer .p-author{font-weight:700;font-size:14px;color:var(--sage-deep);margin-bottom:5px}
  .prayer.answered .p-author{color:#977818}
  .prayer .p-text{font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .prayer .p-actions{display:flex;gap:8px;margin-top:10px}
  .mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);font-family:inherit}
  .mini.ans{color:var(--gold);border-color:#E7D9AE}
  .mini.ans.on{background:var(--gold);color:#fff;border-color:var(--gold)}
  .mini.rm{color:var(--danger)}
  .seal{position:absolute;top:-9px;right:12px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em;box-shadow:0 2px 6px rgba(198,162,75,.35)}


  /* ── Notice ── */
  .notice-grid{display:flex;flex-direction:column;gap:10px}
  .notice-grid label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:3px;display:block}

  .empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 0}

  /* ── Firebase banner ── */
  .fb-banner{background:var(--gold-soft);border:1px solid #E7D9AE;color:#7a621b;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:16px}
  .fb-banner.ok{background:var(--sage-soft);border-color:#C7D3BC;color:var(--sage-deep)}

  /* ── Footer ── */
  footer{text-align:center;padding:24px 16px 6px;color:var(--muted);font-size:13px}
  footer a{color:var(--sage);text-decoration:none;font-weight:600}
  .foot-links{display:flex;justify-content:center;gap:12px;margin:16px 0 4px;flex-wrap:wrap}
  .kakao-share{display:block;width:100%;max-width:340px;margin:0 auto;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;font-family:inherit;background:#FEE500;color:#3C1E1E;cursor:pointer}
  .kakao-share:active{filter:brightness(.95)}
  .share-msg{font-size:13px;font-weight:700;color:var(--sage-deep);min-height:18px;margin-top:8px}
  .link-btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-weight:700;font-size:14px;padding:12px 20px;border-radius:999px;color:#fff}
  .link-btn.home{background:#2BB9CD}
  .link-btn.yt{background:#E0352B}
  .link-btn:active{filter:brightness(.92)}
  .link-btn svg{width:17px;height:17px;flex-shrink:0}
  .share{background:#fff;border:1px dashed var(--sage-soft);border-radius:14px;padding:14px;margin-top:14px;font-size:13px;line-height:1.7;color:var(--sage-deep)}
  .share a{word-break:break-all}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>

<div class="wrap">

  </div>

  <!-- 출석 -->
  <div class="card">

  </div>

  <!-- 오늘말씀 나누기 -->
  <div class="card">

    <input type="text" id="wordPassage" class="passage" placeholder="오늘 본문을 적어주세요 (예: 요한복음 15:1-8)" maxlength="60">
    <textarea id="shareText" placeholder="말씀을 묵상하며 받은 은혜, 깨달음을 나눠주세요" style="margin-top:10px"></textarea>
    <div class="pick-label">누가 나누나요?</div>
    <div class="pickrow" id="sharePick"></div>
    <input type="hidden" id="shareAuthor" value="">
    <button class="btn" id="addShare" style="width:100%;margin-top:12px">나눔 올리기</button>
    <div id="shareList"></div>
  </div>

  <!-- 기도제목 -->
  <div class="card">
    <div class="card-head">
      <div class="card-title"><span class="dot"></span>기도제목</div>
      <div class="card-sub">응답되면 표시해요</div>
    </div>
    <textarea id="prayerText" placeholder="함께 기도할 제목을 나눠주세요"></textarea>
    <div class="pick-label">누가 올리나요?</div>
    <div class="pickrow" id="prayerPick"></div>
    <input type="hidden" id="prayerAuthor" value="">
    <button class="btn" id="addPrayer" style="width:100%;margin-top:12px">기도제목 올리기</button>
    <div id="prayerList"></div>
  </div>

  <!-- 다음 모임 -->
  <div class="card">
    <div class="card-head">
      <div class="card-title"><span class="dot"></span>다음 모임</div>
    </div>
    <div class="notice-grid">
      <div>
        <label>날짜 · 시간</label>
        <input type="text" class="inp" id="nDate" placeholder="예) 7월 12일(토) 저녁 7시">
      </div>
      <div>
        <label>장소</label>
        <input type="text" class="inp" id="nPlace" placeholder="예) 김집사님 댁">
      </div>
      <div>
        <label>안내 · 준비물</label>
        <textarea id="nText" placeholder="예) 저녁 식사 후 나눔 / 각자 반찬 하나씩"></textarea>
      </div>
      <div>
        <label>기타 광고</label>
        <textarea id="nEtc" placeholder="예) 다음 주 전체 목장 연합모임 / 헌금 · 봉사 안내 등"></textarea>
      </div>
    </div>
  </div>

  <footer>
    <div class="foot-links">
      <a class="link-btn home" href="https://www.churchungyeon.net" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.5 11h2.7v9h5v-6h3.6v6h5v-9h2.7z"/></svg>교회 홈페이지

      <a class="link-btn yt" href="https://www.youtube.com/@ChungyeonChurch" target="_blank" rel="noopener">

      </a>
    </div>
    <div style="margin-top:14px">청연교회 · 목장 나눔터</div>
  </footer>

</div>

<script>

/* ══════════════════════════════════════════════════════════ */

const DEFAULT_MEMBERS = ["KY","혜원","정원","정동진","유광하","이정아","옥주(O.J)","박혜정","성은정","kim"];

let db=null, online=false;
try{
  if(!firebaseConfig.apiKey.includes("붙여넣기")){
    firebase.initializeApp(firebaseConfig);
    db=firebase.database();
    online=true;
    const b=document.getElementById('fbBanner');
    b.className='fb-banner ok';
    b.innerHTML='✅ <b>실시간 공유가 켜져 있어요.</b> 이 링크를 받은 목장원 모두가 같은 화면을 함께 봅니다.';
  }
}catch(e){ console.warn('firebase init',e); }

const ref = p => db.ref('mokjang/'+ROOM+'/'+p);

/* ---- 주(週) 계산 ---- */
let weekOffset=0;
function mondayOf(offset){ const d=new Date(); d.setHours(0,0,0,0); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day+offset*7); return d; }
function weekKey(off){ const m=mondayOf(off); return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(m.getDate()).padStart(2,'0'); }
function weekText(off){ const m=mondayOf(off), s=new Date(m); s.setDate(s.getDate()+6); const f=x=>(x.getMonth()+1)+'월 '+x.getDate()+'일'; const tag=off===0?' · 이번 주':off===-1?' · 지난 주':off===1?' · 다음 주':''; return f(m)+' ~ '+f(s)+tag; }
function shortDate(ts){ const d=new Date(ts||Date.now()); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }

/* ---- 상태 ---- */
let members={}, attendance={}, prayers={}, sharings={};

/* ---- 렌더 ---- */
function renderWeek(){ document.getElementById('weekLabel').textContent=weekText(weekOffset); renderMembers(); }
function renderMembers(){
  const wrap=document.getElementById('members');
  const att=attendance[weekKey(weekOffset)]||{};
  const ids=Object.keys(members);
  wrap.innerHTML=''; let present=0;
  if(ids.length===0) wrap.innerHTML='<div class="empty">아래에서 목장원 이름을 추가해 주세요</div>';
  ids.forEach(id=>{
    const on=!!att[id]; if(on)present++;
    const name=members[id];
    const photo=PHOTOS[name];
    const av = photo ? '<img class="avatar" src="'+photo+'" alt="">'
                     : '<div class="avatar">'+escapeHtml((name||'?').slice(0,1))+'</div>';
    const c=document.createElement('div');
    c.className='mcard'+(on?' present':'');
    c.innerHTML=av+'<div class="badge">✓</div><button class="rmx" data-del="'+id+'" aria-label="빼기">✕</button><div class="mname">'+escapeHtml(name)+'</div>';
    c.addEventListener('click',ev=>{
      if(ev.target.dataset.del){ if(confirm(name+' 님을 명단에서 뺄까요?')) removeMember(id); return; }
      toggleAtt(id,!on);
    });
    wrap.appendChild(c);
  });
  document.getElementById('countLine').innerHTML = ids.length? '오늘 <b>'+present+'</b> / '+ids.length+'명 모였어요' : '';
  populateAuthorSelects();
}
function populateAuthorSelects(){
  buildPicker('sharePick','shareAuthor');
  buildPicker('prayerPick','prayerAuthor');
}
function buildPicker(rowId,hiddenId){
  const row=document.getElementById(rowId), hid=document.getElementById(hiddenId);
  if(!row||!hid) return;
  const cur=hid.value;
  const ids=Object.keys(members);
  if(!ids.some(id=>members[id]===cur)){ hid.value=''; }
  row.innerHTML='';
  ids.forEach(id=>{
    const name=members[id], photo=PHOTOS[name];
    const av = photo ? '<img class="pav" src="'+photo+'" alt="">'
                     : '<div class="pav">'+escapeHtml((name||'?').slice(0,1))+'</div>';
    const el=document.createElement('div');
    el.className='pick'+(hid.value===name?' sel':'');
    el.innerHTML=av+'<div class="pnm">'+escapeHtml(name)+'</div>';
    el.addEventListener('click',()=>{
      hid.value = (hid.value===name) ? '' : name;
      row.querySelectorAll('.pick').forEach(p=>p.classList.remove('sel'));
      if(hid.value===name) el.classList.add('sel');
    });
    row.appendChild(el);
  });
}
function renderShares(){
  const list=document.getElementById('shareList');
  const ids=Object.keys(sharings).sort((a,b)=>(sharings[b].ts||0)-(sharings[a].ts||0));
  list.innerHTML='';
  if(ids.length===0){ list.innerHTML='<div class="empty">아직 나눈 은혜가 없어요</div>'; return; }
  ids.forEach(id=>{
    const p=sharings[id];
    const el=document.createElement('div'); el.className='item';
    el.innerHTML='<div class="i-author">'+escapeHtml(p.author||'익명')+'</div>'+
      '<div class="i-text">'+escapeHtml(p.text)+'</div>'+
      '<div class="i-actions"><button class="mini rm" data-rm="'+id+'">삭제</button></div>';
    list.appendChild(el);
  });
  list.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ if(confirm('이 나눔을 삭제할까요?')) save('sharings/'+b.dataset.rm,null); });
}
function renderPrayers(){
  const list=document.getElementById('prayerList');
  const ids=Object.keys(prayers).sort((a,b)=>(prayers[b].ts||0)-(prayers[a].ts||0));
  list.innerHTML='';
  if(ids.length===0){ list.innerHTML='<div class="empty">아직 나눈 기도제목이 없어요</div>'; return; }
  ids.forEach(id=>{
    const p=prayers[id];
    const el=document.createElement('div'); el.className='prayer'+(p.answered?' answered':'');
    el.innerHTML=(p.answered?'<span class="seal">🌾 응답</span>':'')+
      '<div class="p-author">'+escapeHtml(p.author||'익명')+'</div>'+
      '<div class="p-text">'+escapeHtml(p.text)+'</div>'+
      '<div class="p-actions">'+
        '<button class="mini ans'+(p.answered?' on':'')+'" data-ans="'+id+'">'+(p.answered?'응답됨 ✓':'응답 표시')+'</button>'+
        '<button class="mini rm" data-rm="'+id+'">삭제</button></div>';
    list.appendChild(el);
  });
  list.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{ const id=b.dataset.ans; save('prayers/'+id+'/answered',!prayers[id].answered); });
  list.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ if(confirm('이 기도제목을 삭제할까요?')) save('prayers/'+b.dataset.rm,null); });
}

/* ---- 저장 ---- */
function save(path,val){ if(online){ ref(path).set(val); } else { applyLocal(path,val); rerenderAll(); } }
function applyLocal(path,val){
  const p=path.split('/');
  if(p[0]==='members'){ if(val===null) delete members[p[1]]; else members[p[1]]=val; }
  if(p[0]==='attendance'){ const wk=p[1]; attendance[wk]=attendance[wk]||{}; if(val===null||val===false) delete attendance[wk][p[2]]; else attendance[wk][p[2]]=val; }
  if(p[0]==='prayers'){ if(p.length===2){ if(val===null) delete prayers[p[1]]; else prayers[p[1]]=val; } else { prayers[p[1]]=prayers[p[1]]||{}; prayers[p[1]][p[2]]=val; } }
  if(p[0]==='sharings'){ if(val===null) delete sharings[p[1]]; else sharings[p[1]]=val; }
}
function rerenderAll(){ renderMembers(); renderShares(); renderPrayers(); }

/* ---- 액션 ---- */
function addMember(){ const i=document.getElementById('newMember'); const v=i.value.trim(); if(!v)return; const id=online?ref('members').push().key:'m'+Date.now(); save('members/'+id,v); i.value=''; }
function removeMember(id){ save('members/'+id,null); }
function toggleAtt(id,on){ save('attendance/'+weekKey(weekOffset)+'/'+id, on?true:null); }
function addShare(){
  const t=document.getElementById('shareText'), a=document.getElementById('shareAuthor');
  const txt=t.value.trim(); if(!txt)return;
  const obj={text:txt, author:a.value.trim(), ts:Date.now()};
  const id=online?ref('sharings').push().key:'s'+Date.now();
  if(online){ ref('sharings/'+id).set(obj); } else { sharings[id]=obj; renderShares(); }
  t.value=''; a.value='';
  document.querySelectorAll('#sharePick .pick').forEach(p=>p.classList.remove('sel'));
}
function addPrayer(){
  const t=document.getElementById('prayerText'), a=document.getElementById('prayerAuthor');
  const txt=t.value.trim(); if(!txt)return;
  const obj={text:txt, author:a.value.trim(), answered:false, ts:Date.now()};
  const id=online?ref('prayers').push().key:'p'+Date.now();
  if(online){ ref('prayers/'+id).set(obj); } else { prayers[id]=obj; renderPrayers(); }
  t.value=''; a.value='';
  document.querySelectorAll('#prayerPick .pick').forEach(p=>p.classList.remove('sel'));
}

/* ---- 이름 / 본문 / 공지 저장 ---- */
document.getElementById('mokjangName').addEventListener('change',e=>{ if(online) ref('info/name').set(e.target.value); });
document.getElementById('wordPassage').addEventListener('change',e=>{ if(online) ref('info/wordPassage').set(e.target.value); });
['nDate','nPlace','nText','nEtc'].forEach(id=>{ document.getElementById(id).addEventListener('change',e=>{ if(online) ref('info/notice/'+id).set(e.target.value); }); });

/* ---- 버튼 ---- */
document.getElementById('addMember').onclick=addMember;
document.getElementById('newMember').addEventListener('keydown',e=>{if(e.key==='Enter')addMember();});
document.getElementById('addShare').onclick=addShare;
document.getElementById('addPrayer').onclick=addPrayer;
document.getElementById('prevWk').onclick=()=>{weekOffset--;renderWeek();};
document.getElementById('nextWk').onclick=()=>{weekOffset++;renderWeek();};


/* ---- 명단은 항상 기본 10명으로 먼저 채워서 사진이 바로 보이게 ---- */
function seedLocalMembers(){ members={}; DEFAULT_MEMBERS.forEach((n,i)=>{ members['dm'+String(i).padStart(2,'0')]=n; }); }
seedLocalMembers();

/* ---- 실시간 구독 + 최초 명단 세팅 ---- */
if(online){
  ref('members').once('value').then(s=>{
    if(!s.exists()){ const u={}; DEFAULT_MEMBERS.forEach(n=>{ u[ref('members').push().key]=n; }); ref('members').update(u); }
  });
  ref('info/name').once('value').then(s=>{ if(!s.exists()) ref('info/name').set(DEFAULT_NAME); });

  ref('members').on('value',s=>{ const v=s.val(); if(v&&Object.keys(v).length){ members=v; } else { seedLocalMembers(); } renderMembers(); });
  ref('attendance').on('value',s=>{ attendance=s.val()||{}; renderMembers(); });
  ref('sharings').on('value',s=>{ sharings=s.val()||{}; renderShares(); });
  ref('prayers').on('value',s=>{ prayers=s.val()||{}; renderPrayers(); });
  ref('info/name').on('value',s=>{ if(s.val()) document.getElementById('mokjangName').value=s.val(); });
  ref('info/wordPassage').on('value',s=>{ if(document.activeElement.id!=='wordPassage') document.getElementById('wordPassage').value=s.val()||''; });
  ref('info/notice').on('value',s=>{ const n=s.val()||{};
    if(document.activeElement.id!=='nDate') document.getElementById('nDate').value=n.nDate||'';
    if(document.activeElement.id!=='nPlace') document.getElementById('nPlace').value=n.nPlace||'';
    if(document.activeElement.id!=='nText') document.getElementById('nText').value=n.nText||'';
    if(document.activeElement.id!=='nEtc') document.getElementById('nEtc').value=n.nEtc||'';
  });
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

renderWeek(); renderShares(); renderPrayers();
</script>
</body>
</html>
