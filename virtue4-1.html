<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>왕 같은 제사장의 습관·표정과 손</title>

<meta property="og:type" content="website">
<meta property="og:title" content="왕 같은 제사장의 습관·표정과 손">
<meta property="og:description" content="그리스도인의 미덕 4장 · 논증 사슬 (롬 8:5-8) — 눌러서 전체 다이어그램 보기">
<meta property="og:image" content="https://hdi800hdi800-pixel.github.io/praise/virtue4_card-1-1.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://hdi800hdi800-pixel.github.io/praise/virtue4.html">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Pretendard',-apple-system,sans-serif;background:#F3ECDA;color:#4A3A2A}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 14px 44px}
  header{text-align:center;padding:14px 8px 20px}
  .kicker{font-size:13px;letter-spacing:.1em;color:#C49A4A;font-weight:700;margin-bottom:8px}
  h1{font-size:24px;margin:0;color:#4A3A2A}
  .sub{font-size:13.5px;color:#96805F;margin-top:8px;line-height:1.6}
  .diagram{background:#fff;border:1px solid #E4D8BC;border-radius:18px;padding:10px;box-shadow:0 6px 22px rgba(90,66,42,.1);overflow:hidden}
  .diagram img{width:100%;display:block;border-radius:10px;cursor:zoom-in}
  .hint{text-align:center;font-size:12.5px;color:#96805F;margin-top:12px}
  .flow{background:#fff;border:1px solid #E4D8BC;border-radius:16px;padding:16px 18px;margin-top:16px;font-size:14px;line-height:1.9;color:#5A4A38}
  .flow b{color:#C49A4A}
  /* fullscreen zoom */
  .lightbox{position:fixed;inset:0;background:rgba(30,22,14,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
  .lightbox.on{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px}
  .lightbox .x{position:absolute;top:16px;right:20px;color:#fff;font-size:34px;font-weight:300;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">그리스도인의 미덕 · 4장 · 논증 사슬</div>
    <h1>왕 같은 제사장의 습관·표정과 손</h1>
    <div class="sub">롬 8:5-8 · 텔로스 → 습관·표정 → 마음의 병 → 십자가·부활 → 세례·성찬 → 손(용서)</div>
  </header>

  <div class="diagram">
    <img id="dg" src="사슬_얼굴과손_v2-25.png" alt="왕 같은 제사장의 습관·표정과 손 다이어그램">
  </div>
  <div class="hint">👆 그림을 누르면 크게 볼 수 있어요</div>

  <div class="flow">
    <b>텔로스</b>(왕 같은 제사장) → <b>습관·표정</b>(팔복) → <b>마음의 병</b>(스스로는 지킬 수 없음)<br>
    → <b>십자가·부활</b>(하나님나라의 출범) → <b>세례·성찬</b>(습관을 계속 익힘) → <b>손(용서)</b> → 다시 텔로스로<br>
    <span style="color:#96805F;font-size:12.5px">※ 세례·성찬은 자동 스위치가 아니라, 성령의 도우심과 반복되는 순종의 배움이 함께 필요한 은혜의 통로</span>
  </div>
</div>

<div class="lightbox" id="lb"><span class="x" id="x">×</span><img src="사슬_얼굴과손_v2-25.png" alt=""></div>
<script>
  const lb=document.getElementById('lb');
  document.getElementById('dg').onclick=()=>lb.classList.add('on');
  document.getElementById('x').onclick=()=>lb.classList.remove('on');
  lb.onclick=(e)=>{ if(e.target===lb) lb.classList.remove('on'); };
</script>
</body>
</html>
