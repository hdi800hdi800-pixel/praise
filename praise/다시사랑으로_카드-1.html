<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다시 사랑으로 · 청연 북클럽</title>

<!-- Open Graph (카카오톡 미리보기용) -->
<meta property="og:type" content="video.other">
<meta property="og:title" content="다시 사랑으로 · 청연 북클럽">
<meta property="og:description" content="갈라디아서 5:22-23 · 그리스도인의 미덕 6장 사슬 찬양">
<meta property="og:image" content="https://hdi800hdi800-pixel.github.io/praise/praise/다시사랑으로_og.jpg">
<meta property="og:url" content="https://hdi800hdi800-pixel.github.io/praise/praise/다시사랑으로_카드.html">
<meta name="twitter:card" content="summary_large_image">

<style>
  :root{
    --bg-dark:#231a12; --cream:#f6ecd7; --gold:#c79a3f; --gold-deep:#a97f28; --ink:#3c2f1f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-dark);font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  html,body{height:100%;}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;align-items:center;}
  .video-card{
    width:100%; margin:0; overflow:hidden;
    background:#000;
  }
  video{width:100%;display:block;background:#000;}

  /* 업로드 안내 팝업 (배포 전, 내 폰에서 파일 열었을 때만) */
  #uploadGuide{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;}
  #uploadGuide .card{background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  #uploadGuide h3{margin:0 0 10px;font-size:17px;color:#222;}
  #uploadGuide p{font-size:12.5px;color:#666;margin:0 0 12px;line-height:1.5;}
  #uploadGuide code{display:block;background:#f4f4f4;padding:10px;border-radius:8px;font-size:11.5px;word-break:break-all;margin-bottom:14px;color:#333;}
  #uploadGuide a, #uploadGuide button{display:block;width:100%;box-sizing:border-box;text-align:center;padding:13px;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;margin-bottom:8px;border:none;cursor:pointer;}
  #netlifyBtn{background:#00ad9f;color:#fff;}
  #githubBtn{background:#24292f;color:#fff;}
  #copyLinkBtn{background:#FEE500;color:#3c1e1e;}
  #closeGuideBtn{background:none;color:#999;font-weight:500;font-size:13px;margin-bottom:0;}
</style>
</head>
<body>

<div id="uploadGuide">
  <div class="card">
    <h3>📤 업로드 안내</h3>
    <p>이 파일을 아래 중 한 곳에 올리면 공유링크가 활성화돼요.</p>
    <code id="shareLinkText"></code>
    <a id="netlifyBtn" href="https://app.netlify.com/drop" target="_blank">Netlify에 드롭해서 배포</a>
    <a id="githubBtn" href="https://github.com/hdi800hdi800-pixel/praise/upload/main/praise" target="_blank">GitHub praise 폴더에 업로드</a>
    <button id="copyLinkBtn" type="button">🔗 링크 복사</button>
    <button id="closeGuideBtn" type="button">닫기</button>
  </div>
</div>
<div class="wrap">
  <div class="video-card">
    <video id="mainVideo" controls playsinline preload="metadata" poster="https://hdi800hdi800-pixel.github.io/praise/praise/다시사랑으로_og.jpg">
      <source src="https://hdi800hdi800-pixel.github.io/praise/praise/다시_사랑으로_최종.mp4" type="video/mp4">
    </video>
  </div>
</div>

<script>
(function(){
  // 썸네일(영상) 클릭 시 바로 전체화면으로 재생 (가사+음악만 보이게)
  var vid = document.getElementById('mainVideo');
  if (vid) {
    var goneFullscreen = false;
    vid.addEventListener('play', function(){
      if (goneFullscreen) return;
      goneFullscreen = true;
      var req = vid.requestFullscreen || vid.webkitRequestFullscreen || vid.webkitEnterFullscreen || vid.mozRequestFullScreen;
      if (req) {
        try { req.call(vid); } catch(e){}
      }
    }, { once:false });
  }
})();

(function(){
  var host = window.location.hostname;
  // 이미 github.io / netlify.app로 배포되어 열린 경우엔 안내 팝업 숨김 (받는 사람에게는 안 보임)
  if (host.indexOf('github.io') !== -1 || host.indexOf('netlify.app') !== -1) return;

  var rawName = decodeURIComponent(window.location.pathname.split('/').pop() || '') || '다시사랑으로_카드.html';
  // 폰에서 같은 파일 여러 번 받으면 " (1)", " (2)" 등이 붙는데, 실제 공유링크는 항상 원본 파일명 기준
  var cleanName = rawName.replace(/\s*\(\d+\)(?=\.[^.]+$)/, '');
  var shareUrl = 'https://hdi800hdi800-pixel.github.io/praise/praise/' + cleanName;

  setTimeout(function(){
    var linkEl = document.getElementById('shareLinkText');
    if (linkEl) linkEl.textContent = shareUrl;
    var guide = document.getElementById('uploadGuide');
    if (guide) guide.style.display = 'flex';
    if (navigator.clipboard) {
      navigator.clipboard.writeText(shareUrl).catch(function(){});
    }
  }, 600);

  var copyBtn = document.getElementById('copyLinkBtn');
  if (copyBtn) copyBtn.addEventListener('click', function(){
    navigator.clipboard.writeText(shareUrl).then(function(){
      alert('링크가 복사됐어요!');
    }).catch(function(){
      prompt('아래 링크를 복사하세요:', shareUrl);
    });
  });

  var closeBtn = document.getElementById('closeGuideBtn');
  if (closeBtn) closeBtn.addEventListener('click', function(){
    document.getElementById('uploadGuide').style.display = 'none';
  });
})();
</script>
</body>
</html>
