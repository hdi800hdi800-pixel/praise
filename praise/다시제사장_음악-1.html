<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다시 제사장으로</title>

<!-- KakaoTalk / Open Graph 공유 카드 -->
<meta property="og:type" content="music.song">
<meta property="og:title" content="다시 제사장으로">
<meta property="og:image" content="https://hdi800hdi800-pixel.github.io/praise/praise/다시제사장_cover-1.jpg">
<meta property="og:url" content="https://hdi800hdi800-pixel.github.io/praise/praise/다시제사장_음악.html">
<meta property="og:audio" content="https://hdi800hdi800-pixel.github.io/praise/praise/다시_제사장__14_.mp3">
<meta property="og:audio:type" content="audio/mpeg">
<meta name="twitter:card" content="summary_large_image">

<style>
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:#000;
    font-family:-apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%; height:100vh;
    background-image:url('다시제사장_cover-1.jpg');
    background-size:cover;
    background-position:center;
  }
  .stage::before{
    content:"";
    position:absolute; inset:0;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    background:rgba(10,8,6,0.45);
  }
  .title{
    position:absolute; top:8%; left:0; right:0;
    text-align:center;
    color:#f5faff;
    font-size:1.4rem;
    font-weight:700;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
    z-index:2;
  }
  .caption{
    position:absolute; left:5%; right:5%; top:50%;
    transform:translateY(-50%);
    text-align:center;
    color:#f5faff;
    font-size:2.1rem;
    font-weight:700;
    line-height:1.5;
    text-shadow:
      -2px -2px 0 #291505, 2px -2px 0 #291505,
      -2px 2px 0 #291505, 2px 2px 0 #291505,
      0 4px 14px rgba(0,0,0,0.6);
    z-index:2;
    transition:opacity .25s ease;
  }
  .verse{
    position:absolute; left:6%; right:6%; top:50%;
    transform:translateY(-50%);
    text-align:center;
    color:#f5faff;
    font-size:1.5rem;
    font-weight:700;
    line-height:1.7;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
    z-index:2;
    opacity:0;
    transition:opacity 1s ease;
  }
  .controls{
    position:absolute; bottom:6%; left:6%; right:6%;
    z-index:3;
  }
  audio{ width:100%; }
</style>
</head>
<body>

  <div class="stage">
    <div class="title">다시 제사장으로</div>
    <div class="caption" id="caption"></div>
    <div class="verse" id="verse">
      피조물이 고대하는 바는<br>하나님의 아들들이 나타나는 것이니<br>
      <span style="font-size:1.05rem;">(로마서 8:19)</span>
    </div>
    <div class="controls">
      <audio id="player" controls>
        <source src="다시_제사장__14_.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

<script>
  const lines = [[13.35,19.25,"왕 같은 제사장 나를 삼으사"],[19.25,25.16,"팔복의 습관을 얼굴로 짓네"],[25.16,31.06,"내 힘으론 지킬 수 없는 마음"],[31.06,37.5,"병든 나를 십자가로 이끄시네"],[37.5,46.91,"십자가와 부활로 나라 열리고"],[46.91,56.33,"세례와 성찬으로 습관 익히네"],[56.33,64.96,"손을 펴서 용서를 배워갈 때"],[64.96,85.35,"다시 나는 제사장으로 나아가네"],[85.35,92.93,"씻음과 죽음을 기억하며 서서"],[92.93,99.87,"떡과 잔을 붙들고 다시 사네"],[99.87,106.82,"그 은혜의 통로를 걸어가며"],[106.82,113.76,"내 손을 펴 저들을 품에 안네"],[113.76,120.96,"십자가와 부활로 나라 열리고"],[120.96,128.16,"세례와 성찬으로 습관 익히네"],[128.16,134.76,"손을 펴서 용서를 배워갈 때"],[134.76,150.35,"다시 나는 제사장으로 나아가네"],[150.35,159.92,"성령이 내 안에서 일하실 때"],[159.92,170.35,"생명과 평안이 나를 이끄시네"],[170.35,176.64,"자동이 아니라 은혜의 길로"],[176.64,182.35,"순종을 배우며 나아가네"],[182.35,191.6,"십자가와 부활로 나라 열리고"],[191.6,200.84,"세례와 성찬으로 습관 익히네"],[200.84,209.32,"손을 펴서 용서를 배워갈 때"],[209.32,229.35,"다시 나는 제사장으로 나아가네"]];

  const player = document.getElementById('player');
  const caption = document.getElementById('caption');
  const verse = document.getElementById('verse');

  player.addEventListener('timeupdate', () => {
    const t = player.currentTime;
    let text = "";
    for (const [s,e,l] of lines) {
      if (t >= s && t < e) { text = l; break; }
    }
    if (caption.textContent !== text) {
      caption.style.opacity = 0;
      setTimeout(() => { caption.textContent = text; caption.style.opacity = 1; }, 120);
    }
    if (t >= 229.4) {
      verse.style.opacity = 1;
    } else {
      verse.style.opacity = 0;
    }
  });
</script>

</body>
</html>
